name: Build luci-app-neko (Dual SDK)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    strategy:
      matrix:
        sdk:
          - url: "https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            type: "apk"
          - url: "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            type: "ipk"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Extract Version
      id: get_version
      run: |
        VERSION=$(grep PKG_VERSION luci-app-neko/Makefile | sed 's/.*:=//')
        RELEASE=$(grep PKG_RELEASE luci-app-neko/Makefile | sed 's/.*:=//')
        FULL_VERSION=${VERSION}-r${RELEASE}
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $FULL_VERSION"

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl xz-utils zstd

    - name: Download SDK
      run: |
        URL="${{ matrix.sdk.url }}"
        FILE=$(basename "$URL")

        wget -q --show-progress "$URL"
        tar --use-compress-program=unzstd -xvf "$FILE"

        DIR=$(tar -tf "$FILE" | head -n1 | cut -d/ -f1)
        mv "$DIR" sdk

    - name: Cache dl
      uses: actions/cache@v4
      with:
        path: sdk/dl
        key: openwrt-dl-${{ matrix.sdk.type }}-${{ runner.os }}

    - name: Prepare SDK
      run: |
        cd sdk

        sed -i 's|git.openwrt.org/openwrt/openwrt.git|github.com/openwrt/openwrt.git|g' feeds.conf.default
        sed -i 's|git.openwrt.org/project/luci.git|github.com/openwrt/luci.git|g' feeds.conf.default
        sed -i 's|git.openwrt.org/feed/packages.git|github.com/openwrt/packages.git|g' feeds.conf.default

        git config --global http.postBuffer 1048576000
        git config --global core.compression 0
        git config --global http.version HTTP/1.1

        export GIT_OPTIONAL_LOCKS=0

        for i in 1 2 3; do
          ./scripts/feeds update -a && break
          sleep 10
        done

        ./scripts/feeds install -a
        make defconfig

    - name: Copy Package
      run: cp -r luci-app-neko sdk/package/

    - name: Compile
      run: |
        cd sdk
        make package/luci-app-neko/compile V=s -j$(nproc)

    # ================= COLLECT OUTPUT =================
    - name: Collect Output
      run: |
        cd sdk/bin/packages

        FILE=$(find . -name "luci-app-neko*.${{ matrix.sdk.type }}" | head -n1)

        if [ -z "$FILE" ]; then
          echo "Package not found!"
          exit 1
        fi

        VERSION="${{ steps.get_version.outputs.version }}"

        if [ "${{ matrix.sdk.type }}" = "ipk" ]; then
          FINAL="luci-app-neko_${VERSION}_all.ipk"
        else
          FINAL="luci-app-neko_${VERSION}.apk"
        fi

        cp "$FILE" "../../$FINAL"
        echo "FINAL_NAME=$FINAL" >> $GITHUB_ENV
        echo "Built: $FINAL"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FINAL_NAME }}
        path: ${{ env.FINAL_NAME }}

    - name: Publish Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: luci-app-neko v${{ steps.get_version.outputs.version }}
        files: |
          luci-app-neko_${{ steps.get_version.outputs.version }}.apk
          luci-app-neko_${{ steps.get_version.outputs.version }}_all.ipk
