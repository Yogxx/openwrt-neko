name: Build luci-app-neko

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget

      - name: Clone OpenWrt Source
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout openwrt-23.05

      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-neko into OpenWrt
        run: |
          mkdir -p openwrt/package/
          cp -r luci-app-neko openwrt/package/

      - name: Configure Target and Build Package
        run: |
          cd openwrt

          # Set target ke x86_64 biar tidak MIPS
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_Generic=y" >> .config

          # Aktifkan package sebagai module
          echo "CONFIG_PACKAGE_luci-app-neko=m" >> .config

          make defconfig

          # Install tools dan toolchain dulu (stabil untuk CI)
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

          # Compile hanya package kita
          make package/luci-app-neko/compile V=s -j$(nproc)

      - name: Upload IPK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-neko-ipk
          path: openwrt/bin/packages/**/luci-app-neko*.ipk
