name: Build luci-app-nekonedtt

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload build files to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        variant:
          - name: stable-22.03
            sdk_url: "https://archive.openwrt.org/releases/22.03.0/targets/x86/64/openwrt-sdk-22.03.0-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
            pkg_ext: "ipk"
          - name: snapshot
            sdk_url: "https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "apk"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl xz-utils zstd

      - name: Stabilize git (ANTI curl 18)
        run: |
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global http.version HTTP/1.1

      - name: Download & Extract SDK (${{ matrix.variant.name }})
        run: |
          set -e
          SDK_URL="${{ matrix.variant.sdk_url }}"

          echo "Downloading SDK: $SDK_URL"
          if [[ "$SDK_URL" == *.tar.zst ]]; then
            wget -O sdk.tar.zst "$SDK_URL" --tries=5 --timeout=30
            mkdir openwrt
            unzstd sdk.tar.zst
            tar -xf sdk.tar --strip-components=1 -C openwrt
          else
            wget -O sdk.tar.xz "$SDK_URL" --tries=5 --timeout=30
            mkdir openwrt
            tar -xJf sdk.tar.xz --strip-components=1 -C openwrt
          fi

      - name: Clone luci feed only (depth=1)
        run: |
          cd openwrt
          rm -rf feeds
          mkdir feeds
          cd feeds
          git clone --depth=1 https://github.com/openwrt/luci.git luci
          cd ..
          ./scripts/feeds install luci-base

      - name: Copy luci-app-neko
        run: cp -r luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc)

      - name: Extract Version
        id: version
        run: |
          MAKEFILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV
          echo "TAG_NAME=v${PKG_VERSION}-${PKG_RELEASE}" >> $GITHUB_ENV

      - name: Collect package
        run: |
          mkdir -p release
          PKG_FILE=$(find openwrt/bin/packages -type f -name "*neko*.${{ matrix.variant.pkg_ext }}" | head -n1)
          if [ -z "$PKG_FILE" ]; then
            echo "Package not found!"
            exit 1
          fi

          if [ "${{ matrix.variant.pkg_ext }}" = "ipk" ]; then
            NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.all.ipk"
          else
            NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.apk"
          fi

          cp "$PKG_FILE" "release/$NEW_NAME"
          echo "PACKAGE_NAME=$NEW_NAME" >> $GITHUB_ENV
          ls -lah release

      - name: Upload Release (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            luci-app-neko ${{ env.TAG_NAME }}

            📦 Files:
            - luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.all.ipk
            - luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.apk

            🔧 Install Instructions:

            OpenWrt 22.03 (ipk):
            opkg install luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.all.ipk

            OpenWrt Snapshot (apk):
            apk add --allow-untrusted luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.apk
          draft: false
          prerelease: false
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
