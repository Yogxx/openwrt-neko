name: Build luci-app-neko next

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload build files to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: stable-22.03
            sdk_url: "https://archive.openwrt.org/releases/22.03.0/targets/x86/64/openwrt-sdk-22.03.0-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
            pkg_ext: "ipk"
          - name: snapshot
            sdk_url: ""
            pkg_ext: "apk"

    steps:
      - uses: actions/checkout@v4

      # 🔥 FREE DISK
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo docker image prune -af || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl xz-utils zstd

      # 🔧 FIX GIT CURL ERROR
      - name: Fix git network settings
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global http.version HTTP/1.1

      - name: Download & Extract SDK (${{ matrix.variant.name }})
        run: |
          set -e

          if [ "${{ matrix.variant.name }}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
            SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -n 1)
            SDK_URL="$BASE_URL/$SDK_FILE"

            echo "Downloading: $SDK_URL"
            wget -O sdk.tar.zst "$SDK_URL" --tries=5 --timeout=30
            ls -lh sdk.tar.zst

            mkdir openwrt
            unzstd sdk.tar.zst
            tar -xf sdk.tar --strip-components=1 -C openwrt

          else
            SDK_URL="${{ matrix.variant.sdk_url }}"

            echo "Downloading: $SDK_URL"
            wget -O sdk.tar.xz "$SDK_URL" --tries=5 --timeout=30
            ls -lh sdk.tar.xz

            mkdir openwrt
            tar -xJf sdk.tar.xz --strip-components=1 -C openwrt
          fi

          echo "SDK Ready"

      # ⚡ UPDATE FEEDS MINIMAL (NO FULL UPDATE)
      - name: Update minimal feeds
        run: |
          cd openwrt
          ./scripts/feeds update packages
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

      - name: Copy luci-app-neko into SDK
        run: cp -r luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile -j$(nproc) V=s

      - name: Extract Version
        run: |
          MAKEFILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"

          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV
          echo "TAG_NAME=v${PKG_VERSION}-${PKG_RELEASE}" >> $GITHUB_ENV

      - name: Collect package
        run: |
          mkdir -p release
          PKG_FILE=$(find openwrt/bin/packages -type f -name "*neko*.${{ matrix.variant.pkg_ext }}" | head -n1)

          if [ -z "$PKG_FILE" ]; then
            echo "Package not found!"
            exit 1
          fi

          if [ "${{ matrix.variant.pkg_ext }}" = "ipk" ]; then
            NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.all.ipk"
          else
            NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.apk"
          fi

          cp "$PKG_FILE" "release/$NEW_NAME"
          ls -lah release

      - name: Upload Release (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Tag Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
