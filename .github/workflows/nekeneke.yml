name: Build luci-app-neko 25

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl zstd

      # Get latest Snapshot SDK
      - name: Get SDK filename
        id: sdk
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
          SDK_FILE=$(curl -s $BASE_URL/ | grep -oE 'openwrt-sdk-[^"]*x86-64[^"]*\.tar\.zst' | head -n1)
          echo "sdk_file=$SDK_FILE" >> $GITHUB_OUTPUT

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.sdk_file }}
          key: sdk-${{ steps.sdk.outputs.sdk_file }}

      - name: Download SDK if needed
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
          SDK_FILE="${{ steps.sdk.outputs.sdk_file }}"
          if [ ! -f "$SDK_FILE" ]; then
            wget "$BASE_URL/$SDK_FILE"
          fi

      - name: Extract SDK
        run: |
          tar --use-compress-program=unzstd -xf ${{ steps.sdk.outputs.sdk_file }}
          SDK_DIR=$(tar -tf ${{ steps.sdk.outputs.sdk_file }} | head -n1 | cut -d/ -f1)
          mv "$SDK_DIR" openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-neko
        run: |
          cp -r luci-app-neko openwrt/package/

      # 🔥 ENABLE PACKAGE
      - name: Enable luci-app-neko
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_luci-app-neko=m" >> .config
          make defconfig

      # 🔎 BUILD WITH VERBOSE
      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j1

      - name: Collect APK
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;
          ls -lh release

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
