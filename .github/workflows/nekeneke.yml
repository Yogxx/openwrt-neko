name: Build luci-app-neko (OpenWrt 24.10)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3 python3-distutils rsync unzip \
            zlib1g-dev file wget curl

      # ===== CLONE OPENWRT STABLE RELEASE =====
      - name: Clone OpenWrt 24.10
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git
          cd openwrt
          git checkout openwrt-24.10

      # ===== UPDATE FEEDS =====
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== COPY YOUR PACKAGE =====
      - name: Copy luci-app-neko
        run: |
          cp -r luci-app-neko openwrt/package/

      # ===== SELECT TARGET x86_64 =====
      - name: Configure target
        run: |
          cd openwrt
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-neko=m" >> .config
          make defconfig

      # ===== BUILD ONLY YOUR PACKAGE =====
      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc)

      # ===== COLLECT IPK =====
      - name: Collect IPK
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.ipk" -exec cp {} release/ \;
          ls -lh release

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.ipk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
