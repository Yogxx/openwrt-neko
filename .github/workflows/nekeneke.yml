name: Build luci-app-neko (OpenWrt Snapshot SDK)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl zstd

      # ===== DOWNLOAD SDK (AUTO DETECT SNAPSHOT) =====
      - name: Download OpenWrt Snapshot SDK
        run: |
          SDK_FILE=$(wget -qO- https://downloads.openwrt.org/snapshots/targets/x86/64/ \
            | grep -o 'openwrt-sdk-x86-64[^"]*\.tar\.zst' | head -n1)

          wget https://downloads.openwrt.org/snapshots/targets/x86/64/$SDK_FILE
          echo "Downloaded: $SDK_FILE"
          ls -lh *.tar.zst

      # ===== SAFE EXTRACT =====
      - name: Extract SDK
        run: |
          FILE=$(ls openwrt-sdk-*.tar.zst)
          tar --use-compress-program=unzstd -xf "$FILE"
          DIR=$(tar -tf "$FILE" | head -n1 | cut -d/ -f1)
          mv "$DIR" openwrt
          df -h

      # ===== USE DEFAULT FEEDS (NO DUPLICATE LUCI) =====
      - name: Setup feeds
        run: |
          cd openwrt
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ===== COPY YOUR PACKAGE =====
      - name: Copy luci-app-neko
        run: |
          cp -r luci-app-neko openwrt/package/

      # ===== ENABLE PACKAGE =====
      - name: Enable luci-app-neko
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_luci-app-neko=m" >> .config
          make defconfig

      # ===== BUILD (VERBOSE) =====
      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j1

      # ===== COLLECT RESULT =====
      - name: Collect APK
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;
          ls -lh release

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
