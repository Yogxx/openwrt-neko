name: Building Neko DEVx

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-4'
        type: string
      changelog:
        description: 'Changelog'
        required: true
        default: ''
        type: string

jobs:
  build_ipk:
    name: Build Neko
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        release:
          - 24.10.5
        arch:
          - x86_64
          - aarch64_generic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      # ==============================
      # Prepare required directories
      # ==============================
      - name: Create required directories
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          mkdir -p ${{ github.workspace }}/feeds/action

      # ==============================
      # Prepare theme
      # ==============================
      - name: Preparing Theme
        run: |
          git clone -b neko-theme https://github.com/nosignals/neko
          mkdir -p ./luci-app-neko/www/nekoclash/assets/theme
          mkdir -p ./luci-app-neko/www/nekoclash/assets/img
          cp -r ./neko/theme/* ./luci-app-neko/www/nekoclash/assets/theme/
          cp -r ./neko/img/* ./luci-app-neko/www/nekoclash/assets/img/

      # ==============================
      # Copy package into feed
      # ==============================
      - name: Preparing Neko
        run: |
          cp -r ./luci-app-neko ./feeds/action/

      # ==============================
      # Build using OpenWrt SDK
      # ==============================
      - name: Building luci-app-neko
        uses: bobbyunknown/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          FEED_DIR: ${{ github.workspace }}/feeds
          PACKAGES: luci-app-neko
          NO_SHFMT_CHECK: 1
          V: s

      # ==============================
      # Upload build artifact
      # ==============================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}_${{ matrix.arch }}
          path: ${{ github.workspace }}/artifacts/bin/packages/${{ matrix.arch }}/action/luci-app*.ipk

  push_packages:
    name: Push Packages to Release
    needs: build_ipk
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Collect Packages
        run: |
          mkdir -p release
          find . -type f -name "luci-app*.ipk" -exec cp {} release/ \;
          ls -lh release

      - name: Upload Release Asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*
          file_glob: true
          overwrite: true
          prerelease: true
          tag: neko-dev
          body: |
            # LUCI APP NEKO DEV
            Simple Clash TUN based Proxy

            ### Information
            - Dev build (not recommended for production)
            - ${{ inputs.changelog }}

            ### Dependency Requirement
            - bash, kmod-tun, php, php-cgi
            - OpenWrt 24: php8 php8-cgi nftables mihomo
