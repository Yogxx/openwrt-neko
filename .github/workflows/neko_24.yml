name: Build luci-app-neko (OpenWrt 24.10.5 SDK)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:

    # ================= CHECKOUT =================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ================= EXTRACT VERSION =================
    - name: Extract version
      id: get_version
      run: |
        VERSION=$(grep PKG_VERSION luci-app-neko/Makefile | sed 's/.*:=//')
        RELEASE=$(grep PKG_RELEASE luci-app-neko/Makefile | sed 's/.*:=//')
        FULL_VERSION=${VERSION}-r${RELEASE}

        echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $FULL_VERSION"

    # ================= INSTALL DEPENDENCIES =================
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl xz-utils

    # ================= DOWNLOAD OPENWRT 24.10.5 SDK =================
    - name: Download SDK
      run: |
        SDK_URL="https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"

        echo "Downloading OpenWrt 24.10.5 SDK..."
        wget -q --show-progress $SDK_URL -O sdk.tar.zst

        tar --use-compress-program=unzstd -xvf sdk.tar.zst
        EXTRACTED_DIR=$(tar -tf sdk.tar.zst | head -n1 | cut -f1 -d"/")
        mv "$EXTRACTED_DIR" sdk

    # ================= PREPARE SDK (ANTI RPC MODE) =================
    - name: Prepare SDK (Ultra Stable)
      run: |
        cd sdk

        # Strong Git stability config
        git config --global http.postBuffer 524288000
        git config --global http.maxRequests 20
        git config --global core.compression 0
        git config --global http.version HTTP/1.1

        export GIT_OPTIONAL_LOCKS=0

        # Retry feeds update up to 3 times
        for i in 1 2 3; do
          echo "Feeds update attempt $i..."
          ./scripts/feeds update -a -f && break
          sleep 5
        done

        ./scripts/feeds install -a
        make defconfig

    # ================= COPY PACKAGE =================
    - name: Copy luci-app-neko into SDK
      run: |
        cp -r luci-app-neko sdk/package/

    # ================= BUILD PACKAGE =================
    - name: Compile luci-app-neko
      run: |
        cd sdk
        make package/luci-app-neko/compile V=s -j$(nproc)

    # ================= LOCATE IPK =================
    - name: Locate built IPK
      run: |
        FILE=$(find sdk/bin/packages -name "luci-app-neko*.ipk" | head -n1)

        if [ -z "$FILE" ]; then
          echo "IPK not found!"
          exit 1
        fi

        cp "$FILE" luci-app-neko_${FULL_VERSION}.ipk
        echo "IPK_NAME=luci-app-neko_${FULL_VERSION}.ipk" >> $GITHUB_ENV
        ls -lh luci-app-neko_${FULL_VERSION}.ipk

    # ================= UPLOAD ARTIFACT =================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-neko_${{ steps.get_version.outputs.version }}_ipk
        path: luci-app-neko_${{ steps.get_version.outputs.version }}.ipk

    # ================= PUBLISH RELEASE =================
    - name: Publish to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: luci-app-neko v${{ steps.get_version.outputs.version }}
        files: luci-app-neko_${{ steps.get_version.outputs.version }}.ipk
