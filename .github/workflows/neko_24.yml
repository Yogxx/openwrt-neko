name: Build luci-app-neko (OpenWrt 24.10 Stable)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      # 🔥 Download OpenWrt 24.10 Stable SDK
      - name: Download OpenWrt 24.10 SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading OpenWrt SDK from $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"

          if [ ! -s sdk.tar.zst ]; then
            echo "SDK download failed!"
            exit 1
          fi

          mkdir -p openwrt
          zstd -d sdk.tar.zst -c | tar -x -C openwrt --strip-components=1

      # ✅ Update & Install Feeds (FIXED)
      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ✅ Copy package
      - name: Copy luci-app-neko into SDK
        run: |
          cp -r $GITHUB_WORKSPACE/luci-app-neko openwrt/package/
          ls -R openwrt/package/luci-app-neko

      # ✅ Enable package (FIXED)
      - name: Configure SDK
        run: |
          cd openwrt
          echo "CONFIG_PACKAGE_luci-app-neko=m" >> .config
          make defconfig

      # ✅ Build
      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc)

      # Collect IPK
      - name: Collect luci-app-neko IPK
        run: |
          mkdir -p release
          PKG_FILE=$(find openwrt/bin/packages -type f -name "luci-app-neko*.ipk" | head -n1)

          if [ -z "$PKG_FILE" ]; then
            echo "Package not found!"
            exit 1
          fi

          cp "$PKG_FILE" release/
          ls -lah release

      # Upload release
      - name: Upload & Overwrite Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.ipk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
