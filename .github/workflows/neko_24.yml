name: Build luci-app-neko (OpenWrt 25.x APK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ---------------- INSTALL DEP ----------------
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3 python3-distutils rsync unzip zlib1g-dev \
          file wget curl

      # ---------------- GIT STABILITY FIX ----------------
      - name: Improve Git Stability
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequests 10
          git config --global core.compression 0

      # ---------------- CLONE OPENWRT 25.x ----------------
      - name: Clone OpenWrt (25.x main branch)
        run: |
          git clone --depth 1 https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout main

      # ---------------- FIX FEEDS MIRROR ----------------
      - name: Patch feeds to GitHub mirrors (anti RPC failed)
        run: |
          cd openwrt
          sed -i 's|https://git.openwrt.org/feed/packages.git|https://github.com/openwrt/packages.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/project/luci.git|https://github.com/openwrt/luci.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/routing.git|https://github.com/openwrt/routing.git|' feeds.conf.default
          sed -i 's|https://git.openwrt.org/feed/telephony.git|https://github.com/openwrt/telephony.git|' feeds.conf.default

      # ---------------- UPDATE FEEDS ----------------
      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ---------------- COPY PACKAGE ----------------
      - name: Copy luci-app-neko into OpenWrt
        run: |
          mkdir -p openwrt/package/
          cp -r luci-app-neko openwrt/package/

      # ---------------- CONFIGURE ----------------
      - name: Configure Target x86_64
        run: |
          cd openwrt
          
          echo "CONFIG_TARGET_x86=y" >> .config
          echo "CONFIG_TARGET_x86_64=y" >> .config
          echo "CONFIG_TARGET_x86_64_Generic=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-neko=m" >> .config

          make defconfig

      # ---------------- BUILD TOOLCHAIN ----------------
      - name: Build Tools & Toolchain
        run: |
          cd openwrt
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      # ---------------- COMPILE PACKAGE ----------------
      - name: Compile luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc)

      # ---------------- UPLOAD APK ----------------
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-neko-apk
          path: openwrt/bin/packages/**/luci-app-neko*.apk
