name: Build luci-app-neko (OpenWrt 25.x SDK)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ================= CHECKOUT =================
      - uses: actions/checkout@v4

      # ================= EXTRACT VERSION =================
      - name: Extract version
        id: get_version
        run: |
          VERSION=$(grep PKG_VERSION luci-app-neko/Makefile | cut -d: -f2 | tr -d ' ')
          RELEASE=$(grep PKG_RELEASE luci-app-neko/Makefile | cut -d: -f2 | tr -d ' ')
          FULL_VERSION=${VERSION}-r${RELEASE}

          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT

      # ================= INSTALL DEPS =================
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl xz-utils

      # ================= DOWNLOAD SDK =================
      - name: Download OpenWrt 25.x SDK
        run: |
          wget https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-*.Linux-x86_64.tar.zst
          tar --use-compress-program=unzstd -xvf openwrt-sdk-*.tar.zst
          mv openwrt-sdk-* sdk

      # ================= PREPARE SDK =================
      - name: Prepare SDK
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ================= COPY PACKAGE =================
      - name: Copy luci-app-neko
        run: |
          cp -r luci-app-neko sdk/package/

      # ================= CONFIGURE =================
      - name: Configure Package
        run: |
          cd sdk
          make defconfig

      # ================= COMPILE PACKAGE =================
      - name: Compile luci-app-neko
        run: |
          cd sdk
          make package/luci-app-neko/compile V=s -j$(nproc)

      # ================= PREPARE RELEASE =================
      - name: Prepare release file
        run: |
          mkdir -p release
          FILE=$(find sdk/bin/packages -name "luci-app-neko*.apk" | head -n1)

          if [ -z "$FILE" ]; then
            echo "APK not found!"
            exit 1
          fi

          cp "$FILE" release/luci-app-neko_${FULL_VERSION}.apk
          ls -lh release

      # ================= UPLOAD ARTIFACT =================
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-neko_${{ steps.get_version.outputs.version }}
          path: release/luci-app-neko_${{ steps.get_version.outputs.version }}.apk

      # ================= RELEASE =================
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: luci-app-neko v${{ steps.get_version.outputs.version }}
          files: release/luci-app-neko_${{ steps.get_version.outputs.version }}.apk
