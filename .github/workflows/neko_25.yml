name: Build luci-app-neko (OpenWrt 25.x SDK)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    # ================= CHECKOUT =================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ================= EXTRACT VERSION =================
    - name: Extract version
      id: get_version
      run: |
        VERSION=$(grep PKG_VERSION luci-app-neko/Makefile | sed 's/.*:=//')
        RELEASE=$(grep PKG_RELEASE luci-app-neko/Makefile | sed 's/.*:=//')
        FULL_VERSION=${VERSION}-r${RELEASE}

        echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $FULL_VERSION"

    # ================= INSTALL DEPENDENCIES =================
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl xz-utils zstd

    # ================= DOWNLOAD SDK =================
    - name: Download OpenWrt Snapshot SDK (x86_64)
      run: |
        SDK_FILE="openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"

        wget -q --show-progress "$BASE_URL/$SDK_FILE"
        tar --use-compress-program=unzstd -xvf "$SDK_FILE"

        EXTRACTED_DIR=$(tar -tf "$SDK_FILE" | head -n1 | cut -f1 -d"/")
        mv "$EXTRACTED_DIR" sdk

    # ================= CACHE DL FOLDER =================
    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: sdk/dl
        key: openwrt-dl-${{ runner.os }}-25x
        restore-keys: |
          openwrt-dl-${{ runner.os }}

    # ================= PREPARE SDK =================
    - name: Prepare SDK (Ultra Stable Mode)
      run: |
        cd sdk

        echo "Switching to GitHub mirrors..."

        sed -i 's|git.openwrt.org/openwrt/openwrt.git|github.com/openwrt/openwrt.git|g' feeds.conf.default
        sed -i 's|git.openwrt.org/project/luci.git|github.com/openwrt/luci.git|g' feeds.conf.default
        sed -i 's|git.openwrt.org/feed/packages.git|github.com/openwrt/packages.git|g' feeds.conf.default

        git config --global http.postBuffer 1048576000
        git config --global core.compression 0
        git config --global http.version HTTP/1.1
        git config --global fetch.fsckObjects false

        export GIT_OPTIONAL_LOCKS=0

        echo "Updating feeds (retry mode)..."
        for i in 1 2 3; do
          ./scripts/feeds update -a && break
          echo "Retry $i..."
          sleep 15
        done

        ./scripts/feeds install -a
        make defconfig

    # ================= COPY PACKAGE =================
    - name: Copy luci-app-neko to SDK
      run: cp -r luci-app-neko sdk/package/

    # ================= BUILD PACKAGE =================
    - name: Compile luci-app-neko
      run: |
        cd sdk
        make package/luci-app-neko/compile V=s -j$(nproc)

    # ================= LOCATE PACKAGE =================
    - name: Locate built package
      run: |
        FILE=$(find sdk/bin/packages -type f \( -name "luci-app-neko*.apk" -o -name "luci-app-neko*.ipk" \) | head -n1)

        if [ -z "$FILE" ]; then
          echo "Package not found!"
          exit 1
        fi

        EXT="${FILE##*.}"
        FINAL_NAME="luci-app-neko_${FULL_VERSION}.${EXT}"

        cp "$FILE" "$FINAL_NAME"
        echo "FINAL_NAME=$FINAL_NAME" >> $GITHUB_ENV

        ls -lh "$FINAL_NAME"

    # ================= UPLOAD ARTIFACT =================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-neko_${{ steps.get_version.outputs.version }}
        path: ${{ env.FINAL_NAME }}

    # ================= RELEASE =================
    - name: Publish to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: luci-app-neko v${{ steps.get_version.outputs.version }}
        files: ${{ env.FINAL_NAME }}
