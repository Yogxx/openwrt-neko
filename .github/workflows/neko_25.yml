name: Build luci-app-neko (OpenWrt 25.x SDK)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    # ================= CHECKOUT =================
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ================= EXTRACT VERSION (FIXED) =================
    - name: Extract version
      id: get_version
      run: |
        VERSION=$(grep PKG_VERSION luci-app-neko/Makefile | sed 's/.*:=//')
        RELEASE=$(grep PKG_RELEASE luci-app-neko/Makefile | sed 's/.*:=//')
        FULL_VERSION=${VERSION}-r${RELEASE}

        echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
        echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $FULL_VERSION"

    # ================= INSTALL DEPENDENCIES =================
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev \
          libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget curl xz-utils

    # ================= DOWNLOAD SDK =================
    - name: Download OpenWrt Snapshot SDK (x86_64)
      run: |
        SDK_FILE="openwrt-sdk-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
        BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"

        echo "Downloading $SDK_FILE"
        wget "$BASE_URL/$SDK_FILE"

        tar --use-compress-program=unzstd -xvf "$SDK_FILE"

        rm -rf sdk
        EXTRACTED_DIR=$(tar -tf "$SDK_FILE" | head -n1 | cut -f1 -d"/")
        mv "$EXTRACTED_DIR" sdk

    # ================= PREPARE SDK =================
    - name: Prepare SDK (Stable Mode)
      run: |
        cd sdk

        git config --global http.postBuffer 524288000
        git config --global http.maxRequests 10
        git config --global core.compression 0
        git config --global http.version HTTP/1.1

        export GIT_OPTIONAL_LOCKS=0

        ./scripts/feeds update -a -f
        ./scripts/feeds install -a
        make defconfig

    # ================= COPY PACKAGE =================
    - name: Copy luci-app-neko to SDK
      run: |
        cp -r luci-app-neko sdk/package/

    # ================= BUILD PACKAGE =================
    - name: Compile luci-app-neko
      run: |
        cd sdk
        make package/luci-app-neko/compile V=s -j$(nproc)

    # ================= LOCATE APK =================
    - name: Locate built APK
      run: |
        FILE=$(find sdk/bin/packages -name "luci-app-neko*.apk" | head -n1)

        if [ -z "$FILE" ]; then
          echo "APK not found!"
          exit 1
        fi

        cp "$FILE" luci-app-neko_${FULL_VERSION}.apk
        echo "APK_NAME=luci-app-neko_${FULL_VERSION}.apk" >> $GITHUB_ENV
        ls -lh luci-app-neko_${FULL_VERSION}.apk

    # ================= UPLOAD ARTIFACT =================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-neko_${{ steps.get_version.outputs.version }}
        path: luci-app-neko_${{ steps.get_version.outputs.version }}.apk

    # ================= RELEASE =================
    - name: Publish to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        name: luci-app-neko v${{ steps.get_version.outputs.version }}
        files: luci-app-neko_${{ steps.get_version.outputs.version }}.apk
