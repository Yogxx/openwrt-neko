name: Build luci-app-neko next

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Buat/update GitHub Release? (tes manual pilih false biar skip upload)'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
    runs-on: ubuntu-22.04
    steps:
      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            luci-app-neko ${{ github.ref_name }}
            - .ipk untuk OpenWrt 24.10 (opkg)
            - .apk untuk OpenWrt Snapshot (apk)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: stable-24.10
            sdk_url: "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "ipk"
          - name: snapshot
            sdk_url: ""
            pkg_ext: "apk"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt SDK
        run: |
          if [ "${{ matrix.variant.name }}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
            SDK_FILE=$(curl -s "$BASE_URL/" | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -n 1)
            SDK_URL="$BASE_URL/$SDK_FILE"
          else
            SDK_URL="${{ matrix.variant.sdk_url }}"
          fi
          echo "Downloading SDK: $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"
          tar --use-compress-program=unzstd -xf sdk.tar.zst
          SDK_DIR=$(tar -tf sdk.tar.zst | head -n 1 | cut -f1 -d"/")
          rm -rf openwrt
          mv "$SDK_DIR" openwrt

      - name: Update feeds with retry
        run: |
          cd openwrt
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          for i in {1..5}; do
            echo "Attempt $i/5: Updating feeds..."
            ./scripts/feeds update -a && break
            echo "Failed, retrying in 15s..."
            sleep 15
          done
          if [ $i -eq 5 ]; then
            echo "Feeds update failed after 5 attempts"
            exit 1
          fi
          ./scripts/feeds install -a

      - name: Patch pcre2 CMakeLists.txt
        run: |
          cd openwrt
          FILE="feeds/base/package/libs/pcre2/src/CMakeLists.txt"
          if [ -f "$FILE" ]; then
            sed -i 's/cmake_minimum_required(VERSION [0-9.]\+)/cmake_minimum_required(VERSION 3.5...4.0)/' "$FILE"
            echo "Patched pcre2"
          else
            echo "pcre2 file not found"
          fi

      - name: Copy package
        run: cp -r "$GITHUB_WORKSPACE/luci-app-neko" openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc) \
            CMAKE_FLAGS="-DCMAKE_POLICY_VERSION_MINIMUM=3.5" \
            || make package/luci-app-neko/compile V=s -j1 \
              CMAKE_FLAGS="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Extract version
        run: |
          FILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$FILE" | cut -d'=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$FILE" | cut -d'=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV

      - name: Collect & rename
        run: |
          mkdir -p release
          PKG_FILE=\( (find openwrt/bin/packages -name "*neko*. \){{ matrix.variant.pkg_ext }}" | head -1)
          if [ -n "$PKG_FILE" ]; then
            NEW_NAME="luci-app-neko_\( {{ env.PKG_VERSION }}- \){{ env.PKG_RELEASE }}-\( {{ matrix.variant.name }}. \){{ matrix.variant.pkg_ext }}"
            cp "$PKG_FILE" "release/$NEW_NAME"
            echo "Success: $NEW_NAME"
          else
            echo "No package found"
          fi
          ls -la release

      - name: Upload to release
        if: >-
          startsWith(github.ref, 'refs/tags/') ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.${{ matrix.variant.pkg_ext }}
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
