name: Build luci-app-neko next

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            luci-app-neko ${{ github.ref_name }}
            - .ipk for OpenWrt 24.10 (opkg)
            - .apk for OpenWrt Snapshot (apk)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false  # Biar snapshot tetep jalan kalau stable gagal
      matrix:
        variant:
          - name: stable-24.10
            sdk_url: "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "ipk"
            desc: "OpenWrt 24.10 Stable (.ipk)"
          - name: snapshot
            sdk_url: ""
            pkg_ext: "apk"
            desc: "OpenWrt Snapshot (.apk)"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt SDK (${{ matrix.variant.name }})
        run: |
          if [ "${{ matrix.variant.name }}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
            SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -n 1)
            SDK_URL="$BASE_URL/$SDK_FILE"
          else
            SDK_URL="${{ matrix.variant.sdk_url }}"
          fi

          echo "Downloading SDK for ${{ matrix.variant.desc }}: $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"

          tar --use-compress-program=unzstd -xf sdk.tar.zst

          SDK_DIR=$(tar -tf sdk.tar.zst | head -n1 | cut -f1 -d"/")
          rm -rf openwrt
          mv "$SDK_DIR" openwrt

      - name: Prepare Feeds Config with GitHub Mirror
        run: |
          cd openwrt
          cat > feeds.conf <<EOF
          src-git-full base https://github.com/openwrt/openwrt.git;openwrt-24.10
          src-git-full packages https://github.com/openwrt/packages.git;openwrt-24.10
          src-git-full luci https://github.com/openwrt/luci.git;openwrt-24.10
          EOF

      - name: Update Feeds with Retry
        run: |
          cd openwrt

          # Config Git untuk hindari disconnect / large transfer error
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

          # Retry 5x
          for i in {1..5}; do
            echo "Attempt $i/5: Updating feeds..."
            ./scripts/feeds update -a && break
            echo "Failed (mungkin server timeout), retrying in 15s..."
            sleep 15
          done

          if [ $i -eq 5 ]; then
            echo "Feeds update failed after 5 attempts!"
            exit 1
          fi

          ./scripts/feeds install -a

      - name: Copy luci-app-neko into SDK
        run: |
          cp -r "$GITHUB_WORKSPACE/luci-app-neko" openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc) || make package/luci-app-neko/compile V=s -j1

      - name: Extract Version from Makefile
        run: |
          MAKEFILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV
          echo "Extracted: $PKG_VERSION-$PKG_RELEASE"

      - name: Collect and Rename ${{ matrix.variant.pkg_ext }} files
        env:
          VARIANT_NAME: ${{ matrix.variant.name }}
          PKG_EXT: ${{ matrix.variant.pkg_ext }}
        run: |
          mkdir -p release
          echo "Searching for packages..."
          find openwrt/bin/packages -type f -name "*neko*.$PKG_EXT" || true
          PKG_FILE=$(find openwrt/bin/packages -type f -name "*neko*.$PKG_EXT" | head -n1)
          if [ -n "$PKG_FILE" ]; then
            NEW_NAME="luci-app-neko_\( {PKG_VERSION}- \){PKG_RELEASE}-\( {VARIANT_NAME}. \){PKG_EXT}"
            cp "$PKG_FILE" "release/$NEW_NAME"
            echo "Prepared: $NEW_NAME (from $PKG_FILE)"
          else
            echo "WARNING: No $PKG_EXT found for ${VARIANT_NAME}! Check build logs."
            # exit 1  # Comment dulu supaya job ga langsung fail, biar liat snapshot juga
          fi
          ls -lah release || true

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.${{ matrix.variant.pkg_ext }}
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
