name: Build luci-app-neko

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload build files to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      build_type:
        description: "Choose package type to build"
        required: true
        default: "both"
        type: choice
        options:
          - "ipk"
          - "apk"
          - "both"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        variant: [ipk, apk]

    steps:
      - uses: actions/checkout@v4

      # Filter matrix sesuai build_type
      - name: Filter build variant
        id: filter
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "ipk" ]; then
            echo "VARIANT_LIST=ipk" >> $GITHUB_ENV
          elif [ "$BUILD_TYPE" = "apk" ]; then
            echo "VARIANT_LIST=apk" >> $GITHUB_ENV
          else
            echo "VARIANT_LIST=ipk apk" >> $GITHUB_ENV
          fi
          echo "Selected build variants: $VARIANT_LIST"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      # Set TAG environment untuk step release
      - name: Set tag environment
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-${{ github.event.inputs.tag_name }}}"
          echo "TAG=$TAG_NAME" >> $GITHUB_ENV

      - name: Build luci-app-neko
        run: |
          for VARIANT in $VARIANT_LIST; do
            echo "=== Building $VARIANT ==="

            if [ "$VARIANT" = "ipk" ]; then
              SDK_URL="https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
              PKG_EXT="ipk"
            else
              BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
              SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -n1)
              SDK_URL="$BASE_URL/$SDK_FILE"
              PKG_EXT="apk"
            fi

            echo "Downloading SDK: $SDK_URL"
            wget -O sdk.tar.zst "$SDK_URL"
            tar --use-compress-program=unzstd -xf sdk.tar.zst
            SDK_DIR=$(tar -tf sdk.tar.zst | head -n1 | cut -f1 -d"/")
            mv "$SDK_DIR" openwrt

            cd openwrt
            rm -rf feeds/packages feeds/luci feeds/base
            git clone --depth=1 https://git.openwrt.org/feed/base.git feeds/base
            git clone --depth=1 https://git.openwrt.org/feed/packages.git feeds/packages
            git clone --depth=1 https://git.openwrt.org/project/luci.git feeds/luci
            ./scripts/feeds install -a

            cp -r ../../luci-app-neko package/

            make defconfig
            make package/luci-app-neko/compile V=s -j$(nproc)

            # Collect package
            mkdir -p ../release
            PKG_FILE=$(find bin/packages -type f -name "*neko*.$PKG_EXT" | head -n1)
            if [ -z "$PKG_FILE" ]; then
              echo "Package $VARIANT not found!"
              exit 1
            fi

            PKG_VERSION=$(grep '^PKG_VERSION:=' package/luci-app-neko/Makefile | cut -d '=' -f2 | tr -d ' ')
            PKG_RELEASE=$(grep '^PKG_RELEASE:=' package/luci-app-neko/Makefile | cut -d '=' -f2 | tr -d ' ')

            if [ "$PKG_EXT" = "ipk" ]; then
              NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.all.ipk"
            else
              NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.apk"
            fi

            cp "$PKG_FILE" ../release/$NEW_NAME
            cd ..
          done

      - name: Upload Release
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.TAG }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          files: release/*
          
