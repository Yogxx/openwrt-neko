name: Build luci-app-neko next

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload build files to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      build_variant:
        description: "Which variant to build?"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "ipk only"
          - "apk only"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        variant: ${{ fromJson( (github.event_name == 'push' || github.event.inputs.build_variant == 'both') && '[ {"name": "stable-24.10", "sdk_url": "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst", "pkg_ext": "ipk"}, {"name": "snapshot", "sdk_url": "", "pkg_ext": "apk"} ]' || (github.event.inputs.build_variant == 'ipk only') && '[ {"name": "stable-24.10", "sdk_url": "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst", "pkg_ext": "ipk"} ]' || (github.event.inputs.build_variant == 'apk only') && '[ {"name": "snapshot", "sdk_url": "", "pkg_ext": "apk"} ]' || '[]' ) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt SDK (${{ matrix.variant.name }})
        run: |
          if [ "${{ matrix.variant.name }}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
            SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -n 1)
            SDK_URL="$BASE_URL/$SDK_FILE"
          else
            SDK_URL="${{ matrix.variant.sdk_url }}"
          fi

          echo "Downloading: $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"

          tar --use-compress-program=unzstd -xf sdk.tar.zst
          SDK_DIR=$(tar -tf sdk.tar.zst | head -n1 | cut -f1 -d"/")
          mv "$SDK_DIR" openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          rm -rf feeds/packages feeds/luci feeds/base
          git clone --depth=1 https://git.openwrt.org/feed/base.git feeds/base
          git clone --depth=1 https://git.openwrt.org/feed/packages.git feeds/packages
          git clone --depth=1 https://git.openwrt.org/project/luci.git feeds/luci
          ./scripts/feeds install -a

      - name: Copy luci-app-neko into SDK
        run: cp -r luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc)

      - name: Extract Version from Makefile
        id: version
        run: |
          MAKEFILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"

          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV
          echo "TAG_NAME=v\( {PKG_VERSION}- \){PKG_RELEASE}" >> $GITHUB_ENV

      - name: Collect package
        run: |
          mkdir -p release
          PKG_FILE=\( (find openwrt/bin/packages -type f -name "*neko*. \){{ matrix.variant.pkg_ext }}" | head -n1)

          if [ -z "$PKG_FILE" ]; then
            echo "Package not found!"
            exit 1
          fi

          if [ "${{ matrix.variant.pkg_ext }}" = "ipk" ]; then
            NEW_NAME="luci-app-neko_\( {PKG_VERSION}- \){PKG_RELEASE}.all.ipk"
          else
            NEW_NAME="luci-app-neko_\( {PKG_VERSION}- \){PKG_RELEASE}.apk"
          fi

          cp "$PKG_FILE" "release/$NEW_NAME"
          echo "PACKAGE_NAME=$NEW_NAME" >> $GITHUB_ENV
          ls -lah release

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.variant.pkg_ext }}
          path: release/
          retention-days: 1

  release:
    runs-on: ubuntu-22.04
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') || github.event_name == 'push' }}
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release
          merge-multiple: true

      - name: Extract Version from Makefile
        run: |
          MAKEFILE="luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"

          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV

      - name: Set tag name
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v\( {PKG_VERSION}- \){PKG_RELEASE}" >> $GITHUB_ENV
          fi

      - name: Prepare release body
        run: |
          IPK_NAME="luci-app-neko_\( {PKG_VERSION}- \){PKG_RELEASE}.all.ipk"
          APK_NAME="luci-app-neko_\( {PKG_VERSION}- \){PKG_RELEASE}.apk"

          echo "luci-app-neko ${{ env.TAG_NAME }}" > body.txt
          echo "" >> body.txt
          echo "📦 Files:" >> body.txt
          [ -f "release/$IPK_NAME" ] && echo "- $IPK_NAME" >> body.txt
          [ -f "release/$APK_NAME" ] && echo "- $APK_NAME" >> body.txt
          echo "" >> body.txt
          echo "🔧 Install Instructions:" >> body.txt
          if [ -f "release/$IPK_NAME" ]; then
            echo "" >> body.txt
            echo "OpenWrt 24.10 (ipk):" >> body.txt
            echo "opkg install $IPK_NAME" >> body.txt
          fi
          if [ -f "release/$APK_NAME" ]; then
            echo "" >> body.txt
            echo "OpenWrt Snapshot (apk):" >> body.txt
            echo "apk add --allow-untrusted $APK_NAME" >> body.txt
          fi

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body_path: body.txt
          draft: false
          prerelease: false
          files: release/*
