name: Build luci-app-neko (OpenWrt Snapshot SDK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install required packages
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl zstd

      # Download latest Snapshot SDK safely
      - name: Download latest OpenWrt x86_64 SDK
        run: |
          set -e

          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
          INDEX=$(curl -s $BASE_URL/)

          SDK_FILE=$(echo "$INDEX" | grep -oE 'openwrt-sdk-[^"]*x86-64[^"]*\.tar\.zst' | head -n1)

          if [ -z "$SDK_FILE" ]; then
            echo "SDK not found!"
            exit 1
          fi

          echo "Downloading $SDK_FILE"
          wget "$BASE_URL/$SDK_FILE"

          tar --use-compress-program=unzstd -xf "$SDK_FILE"

          SDK_DIR=$(tar -tf "$SDK_FILE" | head -n1 | cut -d/ -f1)
          mv "$SDK_DIR" openwrt

      # Update feeds
      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # Copy package
      - name: Copy luci-app-neko
        run: |
          cp -r luci-app-neko openwrt/package/

      # Configure
      - name: Prepare configuration
        run: |
          cd openwrt
          make defconfig

      # Build only luci-app-neko
      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile -j$(nproc) V=s

      # Collect APK
      - name: Collect APK
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;
          ls -lh release

      # Upload release (overwrite if exists)
      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-neko into SDK
        run: |
          cp -r $GITHUB_WORKSPACE/luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile -j$(nproc)

      - name: Collect luci-app-neko APK only
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;
          ls -lah release

      - name: Upload & Overwrite Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
