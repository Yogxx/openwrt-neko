name: Build luci-app-neko next (OpenWrt 25 SDK Stable)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      # 🔥 Download Latest OpenWrt Snapshot SDK (AUTO & SAFE)
      - name: Download Latest OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
          SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -n 1)

          echo "Downloading $SDK_FILE"
          wget $BASE_URL/$SDK_FILE

          tar --use-compress-program=unzstd -xf $SDK_FILE

          SDK_DIR=$(tar -tf $SDK_FILE | head -n1 | cut -f1 -d"/")
          rm -rf openwrt
          mv "$SDK_DIR" openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-neko into SDK
        run: |
          cp -r $GITHUB_WORKSPACE/luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile -j$(nproc)

      - name: Collect luci-app-neko APK only
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;
          ls -lah release

      - name: Upload & Overwrite Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
