name: Build luci-app-neko next (OpenWrt 25 APK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt Snapshot
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git checkout master

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-neko
        run: |
          cp -r $GITHUB_WORKSPACE/luci-app-neko openwrt/package/

      - name: Configure
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile -j$(nproc) V=s

      - name: Collect APK
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;

      - name: Upload & Overwrite Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
