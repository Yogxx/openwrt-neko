name: Build luci-app-neko-test

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SDK_URL: https://downloads.openwrt.org/releases/25.12.0-rc4/targets/x86/64/openwrt-sdk-25.12.0-rc4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
  SDK_FILE: openwrt-sdk-25.12.0-rc4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev \
            libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget curl zstd

      # 🔥 Cache SDK
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_FILE }}
          key: sdk-25.12.0-rc4-x86-64

      - name: Download SDK if not cached
        run: |
          if [ ! -f "${SDK_FILE}" ]; then
            echo "Downloading SDK..."
            wget "${SDK_URL}"
          else
            echo "Using cached SDK"
          fi

      - name: Extract SDK
        run: |
          tar --use-compress-program=unzstd -xf ${SDK_FILE}
          SDK_DIR=$(tar -tf ${SDK_FILE} | head -n1 | cut -d/ -f1)
          mv "$SDK_DIR" openwrt

      # 🔥 Cache dl folder (BIG speed boost)
      - name: Cache dl directory
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: dl-25.12.0-rc4-x86-64

      # Minimal feeds only
      - name: Update feeds (packages + luci only)
        run: |
          cd openwrt
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci

      - name: Copy luci-app-neko
        run: |
          cp -r luci-app-neko openwrt/package/

      - name: Prepare config
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/{clean,compile} -j$(nproc)

      - name: Collect APK
        run: |
          mkdir -p release
          find openwrt/bin/packages -type f -name "luci-app-neko*.apk" -exec cp {} release/ \;
          ls -lh release

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.apk
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
