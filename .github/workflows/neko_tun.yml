name: Build luci-app-neko next

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: "Upload build files to GitHub Release?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        variant:
          - name: stable-24.10
            sdk_url: "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "ipk"
          - name: snapshot
            sdk_url: "https://downloads.openwrt.org/snapshots/targets/x86/64/openwrt-sdk-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "apk"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      - name: Download and Extract OpenWrt SDK
        run: |
          SDK_URL="${{ matrix.variant.sdk_url }}"
          echo "Downloading OpenWrt SDK from $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"

          # Pastikan file berhasil didownload
          if [ ! -s sdk.tar.zst ]; then
            echo "SDK download failed or file empty!"
            exit 1
          fi

          # Buat folder openwrt
          mkdir -p openwrt

          # Extract menggunakan zstd + tar
          zstd -d sdk.tar.zst -c | tar -x -C openwrt --strip-components=1

          echo "Contents of openwrt directory:"
          ls -lh openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a

      - name: Copy luci-app-neko into SDK
        run: cp -r luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j1

      - name: Extract Version from Makefile
        id: version
        run: |
          MAKEFILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"

          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV
          echo "TAG_NAME=v${PKG_VERSION}-${PKG_RELEASE}" >> $GITHUB_ENV

      - name: Collect package
        run: |
          mkdir -p release
          PKG_FILE=$(find openwrt/bin/packages -type f -name "*neko*.${{ matrix.variant.pkg_ext }}" | head -n1)

          if [ -z "$PKG_FILE" ]; then
            echo "Package not found!"
            exit 1
          fi

          if [ "${{ matrix.variant.pkg_ext }}" = "ipk" ]; then
            NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.all.ipk"
          else
            NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.apk"
          fi

          cp "$PKG_FILE" "release/$NEW_NAME"
          echo "PACKAGE_NAME=$NEW_NAME" >> $GITHUB_ENV
          ls -lah release

      - name: Create Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            luci-app-neko ${{ env.TAG_NAME }}

            📦 Files:
            - luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.all.ipk
            - luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.apk

            🔧 Install Instructions:

            OpenWrt 24.10 (ipk):
            opkg install luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.all.ipk

            OpenWrt Snapshot (apk):
            apk add --allow-untrusted luci-app-neko-${{ env.PKG_VERSION }}-${{ env.PKG_RELEASE }}.apk
          draft: false
          prerelease: false
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to existing tag release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
