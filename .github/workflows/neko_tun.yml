name: Build luci-app-neko next

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload build files to GitHub Release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            luci-app-neko ${{ github.ref_name }}
            - .ipk for OpenWrt 24.10 (opkg)
            - .apk for OpenWrt Snapshot (apk)
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        variant:
          - name: stable-24.10
            sdk_url: "https://downloads.openwrt.org/releases/24.10.5/targets/x86/64/openwrt-sdk-24.10.5-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
            pkg_ext: "ipk"
            desc: "OpenWrt 24.10 Stable (.ipk)"
          - name: snapshot
            sdk_url: ""
            pkg_ext: "apk"
            desc: "OpenWrt Snapshot (.apk)"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      - name: Download OpenWrt SDK (${{ matrix.variant.name }})
        run: |
          if [ "${{ matrix.variant.name }}" = "snapshot" ]; then
            BASE_URL="https://downloads.openwrt.org/snapshots/targets/x86/64"
            SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -n 1)
            SDK_URL="$BASE_URL/$SDK_FILE"
          else
            SDK_URL="${{ matrix.variant.sdk_url }}"
          fi

          echo "Downloading SDK for ${{ matrix.variant.desc }}: $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"

          tar --use-compress-program=unzstd -xf sdk.tar.zst

          SDK_DIR=$(tar -tf sdk.tar.zst | head -n1 | cut -f1 -d"/")
          rm -rf openwrt
          mv "$SDK_DIR" openwrt

      - name: Update Feeds (with retry & buffer fix)
        run: |
          cd openwrt
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global fetch.recurseSubmodules false
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            ./scripts/feeds update -a --depth=1 && break || \
            echo "Retry $i/$MAX_RETRIES..." && sleep 5
          done
          ./scripts/feeds install -a

      - name: Copy luci-app-neko into SDK
        run: |
          cp -r "$GITHUB_WORKSPACE/luci-app-neko" openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc) || make package/luci-app-neko/compile V=s -j1

      - name: Extract Version from Makefile
        run: |
          MAKEFILE="openwrt/package/luci-app-neko/Makefile"
          PKG_VERSION=$(grep '^PKG_VERSION:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          PKG_RELEASE=$(grep '^PKG_RELEASE:=' "$MAKEFILE" | cut -d '=' -f2 | tr -d ' ')
          [ -z "$PKG_VERSION" ] && PKG_VERSION="unknown"
          [ -z "$PKG_RELEASE" ] && PKG_RELEASE="1"
          echo "PKG_VERSION=$PKG_VERSION" >> $GITHUB_ENV
          echo "PKG_RELEASE=$PKG_RELEASE" >> $GITHUB_ENV
          echo "Extracted PKG_VERSION: $PKG_VERSION, PKG_RELEASE: $PKG_RELEASE"

      - name: Collect and Rename ${{ matrix.variant.pkg_ext }} files
        env:
          PKG_EXT: ${{ matrix.variant.pkg_ext }}
        run: |
          mkdir -p release
          PKG_FILE=$(find openwrt/bin/packages -type f -name "*neko*.$PKG_EXT" | head -n1)
          if [ -n "$PKG_FILE" ]; then
            if [ "$PKG_EXT" = "ipk" ]; then
              NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.all.$PKG_EXT"
            else
              NEW_NAME="luci-app-neko_${PKG_VERSION}-${PKG_RELEASE}.$PKG_EXT"
            fi
            cp "$PKG_FILE" "release/$NEW_NAME"
            echo "Prepared: $NEW_NAME"
          else
            echo "No $PKG_EXT found!"
            exit 1
          fi
          ls -lah release

      - name: Upload to Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/*.${{ matrix.variant.pkg_ext }}
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
