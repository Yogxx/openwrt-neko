name: Build Neko DEV (OpenWrt 25.12)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
        type: string
      changelog:
        description: 'Changelog'
        required: false
        default: ''
        type: string

jobs:
  build_packages:
    name: Build Neko (${{ matrix.arch }})
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        release:
          - snapshots
        arch:
          - x86_64
          - aarch64_generic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Neko Theme
        run: |
          git clone -b neko-theme https://github.com/nosignals/neko
          cp -rf neko/theme/* luci-app-neko/htdocs/nekoclash/assets/theme/
          cp -rf neko/img/* luci-app-neko/htdocs/nekoclash/assets/img/

      - name: Prepare Feeds
        run: |
          mkdir -p feeds artifacts
          cp -rf luci-app-neko feeds/
          cp -rf mihomo feeds/

      - name: Build Packages (APK/IPK)
        uses: nosignals/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEED_DIR: ${{ github.workspace }}/feeds
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PACKAGES: mihomo luci-app-neko
          NO_SHFMT_CHECK: 1

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}-${{ matrix.arch }}
          path: |
            artifacts/bin/packages/**/action/*.apk
            artifacts/bin/packages/**/action/*.ipk

  release_packages:
    name: Publish Release
    needs: build_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Collect Packages
        run: |
          mkdir -p release
          find . -type f \( -name "*.apk" -o -name "*.ipk" \) -exec cp {} release/ \;
          ls -lh release

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: neko-dev
          prerelease: true
          overwrite: true
          file_glob: true
          file: release/*
          body: |
            # LUCI APP NEKO DEV (OpenWrt 25.12)

            ⚠️ Development build – **not recommended for production**

            ## Information
            - Version   : ${{ inputs.version }}
            - Changelog :
              - ${{ inputs.changelog }}

            ## Package Format
            - OpenWrt 25.12 : **APK**
            - Legacy        : IPK (fallback)

            ## Dependency
            - bash
            - kmod-tun
            - php / php-cgi
            - nftables
            - mihomo

            > PHP harus di-install manual sebelum luci-app-neko
            
