name: Building Neko Next (Official SDK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
        type: string
      changelog:
        description: 'Changelog'
        required: true
        default: 'Fast build: Targeted armsr/armv8 and x86/64'
        type: string
        
jobs: 
  build:
    permissions:
      contents: write
    name: Build ${{ matrix.arch }} - ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Target Stable 24.10.5 (Output .ipk)
          - release: 24.10.5
            arch: armsr-armv8
          - release: 24.10.5
            arch: x86-64

          # Target Snapshot / 25.12 (Output .apk)
          - release: snapshot
            arch: armsr-armv8
          - release: snapshot
            arch: x86-64

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Preparing Source
        run: |
          # Membuat struktur feed lokal
          mkdir -p custom-feeds/neko
          # Hanya copy luci-app-neko agar build cepat (tanpa kompilasi mihomo)
          cp -rf ./luci-app-neko custom-feeds/neko/
          
          # Inject theme (Langkah opsional)
          git clone -b neko-theme https://github.com/nosignals/neko tmp-neko
          mkdir -p custom-feeds/neko/luci-app-neko/htdocs/nekoclash/assets/theme/
          cp -rf tmp-neko/theme/* custom-feeds/neko/luci-app-neko/htdocs/nekoclash/assets/theme/ || true
          rm -rf tmp-neko
          
      - name: Build Packages (Official SDK)
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEEDNAME: custom_feed
          FEEDDIR: ${{ github.workspace }}/custom-feeds
          PACKAGES: luci-app-neko
          IGNORE_ERRORS: m
          NO_SIGNCHECK: 1

      - name: Collecting Artifacts
        run: |
          mkdir -p ./bin-artifacts
          # Mengambil hanya file luci-app-neko (ipk/apk)
          # Mencari dari root folder bin/ agar .apk di snapshot tetap ketemu
          find bin/ -type f \( -name "luci-app-neko*.ipk" -o -name "luci-app-neko*.apk" \) -exec cp {} ./bin-artifacts/ \;
          echo "Files collected:"
          ls -R ./bin-artifacts

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}-${{ matrix.arch }}
          path: ./bin-artifacts/*

  release:
    needs: build
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-releases

      - name: Organize Files
        run: |
          mkdir -p ./final-release
          find ./all-releases -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ./final-release/ \;

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./final-release/*
          overwrite: true
          prerelease: true
          tag: neko-dev
          file_glob: true
          body: |
            ## Neko Multi-Format Fast Build
            Built using Official OpenWrt SDK.
            
            ### Details
            - **Version**: ${{ inputs.version }}
            - **Target**: armsr/armv8 (ARMv8 SystemReady) & x86/64.
            - **Format .apk**: Gunakan untuk OpenWrt 25.12+ (Apin Edition).
            - **Format .ipk**: Gunakan untuk OpenWrt 24.10 dan versi lama.
            - **Note**: Mihomo tidak disertakan untuk mempercepat proses build.
            - **Changelog**: ${{ inputs.changelog }}
