name: Building Neko Next (Official SDK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
        type: string
      changelog:
        description: 'Changelog'
        required: true
        default: 'Migrated to Official SDK for APK/IPK support'
        type: string
        
jobs: 
  build:
    permissions:
      contents: write
    name: Build ${{ matrix.arch }} - ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Versi IPK (Gunakan tag 'openwrt-24.10' agar Docker image ditemukan)
          - release: openwrt-24.10
            arch: x86-64
          - release: openwrt-24.10
            arch: aarch64-generic

          # Versi APK (Gunakan 'snapshot' untuk dukungan sistem .apk OpenWrt 25.12)
          - release: snapshot
            arch: x86-64
          - release: snapshot
            arch: aarch64-generic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Preparing Source
        run: |
          # Membuat struktur feed lokal
          mkdir -p custom-feeds/neko
          cp -rf ./luci-app-neko custom-feeds/neko/
          cp -rf ./mihomo custom-feeds/neko/
          
          # Inject theme (Langkah opsional)
          git clone -b neko-theme https://github.com/nosignals/neko tmp-neko
          mkdir -p custom-feeds/neko/luci-app-neko/htdocs/nekoclash/assets/theme/
          cp -rf tmp-neko/theme/* custom-feeds/neko/luci-app-neko/htdocs/nekoclash/assets/theme/ || true
          rm -rf tmp-neko
          
      - name: Build Packages (Official SDK)
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEEDNAME: custom_feed
          FEEDDIR: ${{ github.workspace }}/custom-feeds
          PACKAGES: luci-app-neko mihomo
          # Mengabaikan error pada paket dependensi lain (seperti apache/php) agar build tetap lanjut
          IGNORE_ERRORS: m
          NO_SIGNCHECK: 1

      - name: Collecting Artifacts
        run: |
          mkdir -p ./bin-artifacts
          # Mengambil file .ipk (opkg) dan .apk (apk-tools) secara otomatis
          find bin/packages/ -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ./bin-artifacts/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}-${{ matrix.arch }}
          path: ./bin-artifacts/*

  release:
    needs: build
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-releases

      - name: Organize Files
        run: |
          mkdir -p ./final-release
          find ./all-releases -type f -name "*" -exec cp {} ./final-release/ \;

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./final-release/*
          overwrite: true
          prerelease: true
          tag: neko-dev
          file_glob: true
          body: |
            ## Neko Multi-Format Release
            Built using Official OpenWrt SDK.
            
            ### Details
            - **Version**: ${{ inputs.version }}
            - **Format .apk**: Gunakan untuk OpenWrt 25.12+ (Apin Edition).
            - **Format .ipk**: Gunakan untuk OpenWrt 24.10, 23.05, dan versi lama.
            - **Changelog**: ${{ inputs.changelog }}
