name: Building Neko Next (Official SDK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
        type: string
      changelog:
        description: 'Changelog'
        required: true
        default: 'Migrated to Official SDK for APK/IPK support'
        type: string
        
jobs: 
  build:
    permissions:
      contents: write
    name: Build ${{ matrix.arch }} - ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Versi IPK (24.10)
          - release: openwrt-24.10
            arch: x86-64
          - release: openwrt-24.10
            arch: armvirt-64bit # Perbaikan: Gunakan armvirt-64bit agar image SDK ditemukan

          # Versi APK (Snapshot / 25.12)
          - release: snapshot
            arch: x86-64
          - release: snapshot
            arch: armvirt-64bit # Perbaikan: Gunakan armvirt-64bit agar image SDK ditemukan

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Preparing Source
        run: |
          mkdir -p custom-feeds/neko
          cp -rf ./luci-app-neko custom-feeds/neko/
          cp -rf ./mihomo custom-feeds/neko/
          
          git clone -b neko-theme https://github.com/nosignals/neko tmp-neko
          mkdir -p custom-feeds/neko/luci-app-neko/htdocs/nekoclash/assets/theme/
          cp -rf tmp-neko/theme/* custom-feeds/neko/luci-app-neko/htdocs/nekoclash/assets/theme/ || true
          rm -rf tmp-neko
          
      - name: Build Packages (Official SDK)
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEEDNAME: custom_feed
          FEEDDIR: ${{ github.workspace }}/custom-feeds
          PACKAGES: luci-app-neko mihomo
          IGNORE_ERRORS: m
          NO_SIGNCHECK: 1

      - name: Collecting Artifacts
        run: |
          mkdir -p ./bin-artifacts
          # Filter khusus: Hanya mengambil file yang diawali dengan 'luci-app-neko'
          # Mencari di seluruh folder bin agar .apk yang lokasinya berbeda tetap ketemu
          find bin/ -type f \( -name "luci-app-neko*.ipk" -o -name "luci-app-neko*.apk" \) -exec cp {} ./bin-artifacts/ \;
          
          # Cek hasil di log untuk memastikan file tercopy
          echo "Files collected:"
          ls -R ./bin-artifacts

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}-${{ matrix.arch }}
          path: ./bin-artifacts/*

  release:
    needs: build
    name: Create Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./all-releases

      - name: Organize Files
        run: |
          mkdir -p ./final-release
          # Hanya mengambil file ipk/apk dari semua subfolder artifact
          find ./all-releases -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ./final-release/ \;

      - name: Upload to GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./final-release/*
          overwrite: true
          prerelease: true
          tag: neko-dev
          file_glob: true
          body: |
            ## Neko Multi-Format Release
            Built using Official OpenWrt SDK.
            
            ### Details
            - **Version**: ${{ inputs.version }}
            - **Format .apk**: Mendukung OpenWrt 25.12+ (Apin Edition).
            - **Format .ipk**: Mendukung OpenWrt 24.10 dan versi lama.
            - **Changelog**: ${{ inputs.changelog }}
