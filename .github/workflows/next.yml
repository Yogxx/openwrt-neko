name: Build luci-app-neko (Stable + Snapshot)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Snapshot 25 → APK
          - name: snapshot
            sdk_path: snapshots/targets/x86/64
            pkg_type: apk

          # OpenWrt 24.10 Stable → IPK
          - name: 24.10.0
            sdk_path: releases/24.10.0/targets/x86/64
            pkg_type: ipk

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      # 🔹 Ambil versi dari Makefile
      - name: Get version from Makefile
        run: |
          VERSION=$(grep PKG_VERSION luci-app-neko/Makefile | cut -d':=' -f2 | tr -d ' ')
          RELEASE=$(grep PKG_RELEASE luci-app-neko/Makefile | cut -d':=' -f2 | tr -d ' ')
          FULL_VERSION=${VERSION}-${RELEASE}
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "Detected version: $FULL_VERSION"

      # 🔹 Download SDK
      - name: Download OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/${{ matrix.sdk_path }}"
          echo "Checking SDK at $BASE_URL"

          SDK_FILE=$(curl -s $BASE_URL/ | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -n1)

          if [ -z "$SDK_FILE" ]; then
            echo "❌ SDK not found"
            exit 1
          fi

          wget -q $BASE_URL/$SDK_FILE
          tar --use-compress-program=unzstd -xf $SDK_FILE

          SDK_DIR=$(tar -tf $SDK_FILE | head -n1 | cut -f1 -d"/")
          mv "$SDK_DIR" openwrt

      - name: Update Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy luci-app-neko
        run: |
          cp -r $GITHUB_WORKSPACE/luci-app-neko openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build luci-app-neko
        run: |
          cd openwrt
          make package/luci-app-neko/compile -j$(nproc)

      # 🔹 Ambil hasil package & rename sesuai versi
      - name: Collect Package
        run: |
          mkdir -p release

          if [ "${{ matrix.pkg_type }}" = "apk" ]; then
            FILE=$(find openwrt/bin/packages -name "luci-app-neko*.apk" | head -n1)
            cp "$FILE" release/luci-app-neko_${FULL_VERSION}.apk
          else
            FILE=$(find openwrt/bin/packages -name "luci-app-neko*.ipk" | head -n1)
            cp "$FILE" release/luci-app-neko_${FULL_VERSION}.all.ipk
          fi

          ls -lah release

      # 🔹 Upload ke Release hanya saat push tag
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
