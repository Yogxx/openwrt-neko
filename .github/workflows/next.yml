name: Build luci-app (Stable + Snapshot)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          # Snapshot → APK
          - name: snapshot
            sdk_path: snapshots/targets/x86/64
            pkg_type: apk

          # Stable 24.10 → IPK
          - name: 24.10.0
            sdk_path: releases/24.10.0/targets/x86/64
            pkg_type: ipk

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
          python3-distutils rsync unzip zlib1g-dev file wget curl zstd

      # 🔹 Ambil versi aman dari Makefile
      - name: Get version from Makefile
        run: |
          PKG_DIR=$(find . -maxdepth 1 -type d -name "luci-app-*")
          VERSION=$(sed -n 's/^PKG_VERSION:=//p' $PKG_DIR/Makefile | tr -d ' ')
          RELEASE=$(sed -n 's/^PKG_RELEASE:=//p' $PKG_DIR/Makefile | tr -d ' ')
          FULL_VERSION=${VERSION}-${RELEASE}

          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "PKG_DIR=$PKG_DIR" >> $GITHUB_ENV

          echo "Detected version: $FULL_VERSION"

      # 🔹 Download SDK
      - name: Download OpenWrt SDK
        run: |
          BASE_URL="https://downloads.openwrt.org/${{ matrix.sdk_path }}"
          echo "Using SDK: $BASE_URL"

          SDK_FILE=$(curl -fsSL $BASE_URL/ | grep -o 'openwrt-sdk-[^"]*\.tar\.zst' | head -n1)

          if [ -z "$SDK_FILE" ]; then
            echo "❌ SDK not found"
            exit 1
          fi

          wget -q --tries=3 --retry-connrefused $BASE_URL/$SDK_FILE
          tar --use-compress-program=unzstd -xf $SDK_FILE

          SDK_DIR=$(tar -tf $SDK_FILE | head -n1 | cut -f1 -d"/")
          mv "$SDK_DIR" openwrt

      # 🔥 Update Feeds (SUPER ANTI RPC FAIL)
      - name: Update Feeds
        run: |
          cd openwrt

          # Prevent curl 18 / RPC failed
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global fetch.fsckObjects false
          git config --global transfer.fsckObjects false

          # Force shallow clone feeds
          sed -i 's/src-git /src-git --depth=1 /g' feeds.conf.default

          # Retry update
          for i in 1 2 3; do
            echo "Feed update attempt $i..."
            ./scripts/feeds update -a && break
            sleep 5
          done

          ./scripts/feeds install -a

      - name: Copy Package
        run: |
          cp -r $PKG_DIR openwrt/package/

      - name: Configure SDK
        run: |
          cd openwrt
          make defconfig

      - name: Build Package
        run: |
          cd openwrt
          make package/luci-app-neko/compile V=s -j$(nproc)

      # 🔹 Collect result
      - name: Collect Package
        run: |
          mkdir -p release

          if [ "${{ matrix.pkg_type }}" = "apk" ]; then
            FILE=$(find openwrt/bin/packages -name "luci-app-*.apk" | head -n1)
            cp "$FILE" release/luci-app-neko_${FULL_VERSION}.apk
          else
            FILE=$(find openwrt/bin/packages -name "luci-app-*.ipk" | head -n1)
            cp "$FILE" release/luci-app-neko_${FULL_VERSION}.all.ipk
          fi

          ls -lah release

      # 🔹 Upload release only on tag
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
