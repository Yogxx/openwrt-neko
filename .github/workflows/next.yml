name: Build luci-app-neko (OpenWrt 24.10)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # =========================
    # Install Dependencies
    # =========================
    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential \
          clang flex bison g++ gawk \
          gcc-multilib g++-multilib \
          gettext git libncurses-dev \
          libssl-dev python3-setuptools \
          rsync swig unzip zlib1g-dev \
          file wget

    # =========================
    # Download OpenWrt SDK 24.10 (x86_64 generic)
    # PKGARCH=all jadi cukup 1 SDK
    # =========================
    - name: Download OpenWrt 24.10 SDK
      run: |
        wget https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        tar -xf openwrt-sdk-*.tar.xz
        mv openwrt-sdk-* openwrt

    # =========================
    # Setup Stable Feeds Mirror
    # =========================
    - name: Configure Feeds (GitHub Mirror)
      run: |
        cd openwrt

        git config --global http.postBuffer 524288000
        git config --global core.compression 0

        rm -f feeds.conf.default

        cat <<EOF > feeds.conf.default
        src-git packages https://github.com/openwrt/packages.git;openwrt-24.10
        src-git luci https://github.com/openwrt/luci.git;openwrt-24.10
        src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
        src-git telephony https://github.com/openwrt/telephony.git;openwrt-24.10
        EOF

        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================
    # Copy Package
    # =========================
    - name: Copy luci-app-neko into SDK
      run: |
        mkdir -p openwrt/package/luci-app-neko
        cp -r ./* openwrt/package/luci-app-neko/

    # =========================
    # Extract Version from Makefile
    # =========================
    - name: Extract Version
      id: version
      run: |
        VERSION=$(grep PKG_VERSION Makefile | head -n1 | cut -d= -f2)
        RELEASE=$(grep PKG_RELEASE Makefile | head -n1 | cut -d= -f2)
        FULL_VERSION=${VERSION}-${RELEASE}

        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
        echo "Detected version: $FULL_VERSION"

    # =========================
    # Build Package
    # =========================
    - name: Build luci-app-neko
      run: |
        cd openwrt
        make defconfig
        make package/luci-app-neko/compile -j$(nproc) V=s

    # =========================
    # Collect & Rename Output
    # =========================
    - name: Collect IPK
      run: |
        mkdir -p output
        find openwrt/bin/packages -name "*.ipk" -type f -exec cp {} output/ \;

        cd output
        for f in *.ipk; do
          mv "$f" "luci-app-neko_${FULL_VERSION}.all.ipk"
          cp "luci-app-neko_${FULL_VERSION}.all.ipk" \
             "luci-app-neko_${VERSION}.apk"
        done

    # =========================
    # Upload Artifact
    # =========================
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: luci-app-neko_${{ env.FULL_VERSION }}
        path: output/*

    # =========================
    # Auto Tag & Release
    # =========================
    - name: Create Git Tag
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git tag -f v${VERSION}
        git push origin v${VERSION} --force

    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: luci-app-neko v${{ env.VERSION }}
        files: output/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
