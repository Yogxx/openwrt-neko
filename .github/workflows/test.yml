name: Building Neko DEV 25

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
        type: string
      changelog:
        description: 'Changelog'
        required: true
        default: ''
        type: string

jobs:
  build_packages:
    name: Build LuCI Neko
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: true
      matrix:
        release:
          - 24.10.5
          - 25.12.0-rc4
        arch:
          - x86_64
          - aarch64_generic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Preparing Theme
        shell: bash
        run: |
          set -e
          git clone -b neko-theme https://github.com/nosignals/neko
          cp -r ./neko/theme/* ./luci-app-neko/htdocs/nekoclash/assets/theme/
          cp -r ./neko/img/* ./luci-app-neko/htdocs/nekoclash/assets/img/

      - name: Preparing Feeds
        shell: bash
        run: |
          set -e
          mkdir -p feeds artifacts
          cp -r ./luci-app-neko ./feeds

      - name: Build Package (FAIL HARD)
        uses: nosignals/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEED_DIR: ${{ github.workspace }}/feeds
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          PACKAGES: luci-app-neko
          MAKE_FLAGS: -j1 V=s --no-print-directory
          NO_SHFMT_CHECK: 1

      - name: Hard Fail on Build Error
        shell: bash
        run: |
          set -e
          echo "🔎 Checking for fatal build errors..."

          if grep -R "recursive dependency detected" artifacts; then
            echo "❌ Recursive dependency detected"
            exit 1
          fi

          if grep -R "error:" artifacts; then
            echo "❌ Generic build error detected"
            exit 1
          fi

          echo "✅ Build clean, no fatal errors"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}_${{ matrix.arch }}
          path: artifacts/bin/packages/**/action/luci-app*

  release:
    name: Publish Release
    needs: build_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Collect Packages
        shell: bash
        run: |
          set -e
          mkdir -p release
          find . -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ./release/ \;
          ls -lh release

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: neko-dev
          prerelease: true
          overwrite: true
          file_glob: true
          file: release/*
          body: |
            # LUCI APP NEKO (DEV)

            ⚠️ Development build – not recommended for production

            ## Changelog
            - ${{ inputs.changelog }}

            ## Compatibility
            - OpenWrt 24.10.x → `.ipk`
            - OpenWrt 25.12.x → `.apk`

            ## Runtime Dependencies (install manually)
            - bash
            - kmod-tun
            - php8
            - php8-cgi
            - sing-box
            - mihomo
            
