name: Build LuCI Neko

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
      changelog:
        description: 'Changelog'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - release: 25.12.0-rc4
            target: x86/64
            sdk_arch: x86-64
          - release: 25.12.0-rc4
            target: armsr/armv8
            sdk_arch: armsr-armv8

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget zstd

      - name: Download OpenWrt SDK
        run: |
          set -e
          SDK_URL="https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/${{ matrix.target }}/openwrt-sdk-${{ matrix.release }}-${{ matrix.sdk_arch }}_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
          echo "Downloading $SDK_URL"
          wget -O sdk.tar.zst "$SDK_URL"

      - name: Extract SDK
        run: |
          set -e
          tar --zstd -xf sdk.tar.zst
          SDK_DIR=$(ls -d openwrt-sdk-*)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV

      - name: Prepare feeds + local package
        run: |
          set -e
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          mkdir -p package/local
          cp -r "$GITHUB_WORKSPACE/luci-app-neko" package/local/

      - name: Configure
        run: |
          set -e
          cd "$SDK_DIR"
          make defconfig

          if grep -R "recursive dependency detected" tmp/; then
            echo "❌ Recursive dependency detected"
            exit 1
          fi

      - name: Build luci-app-neko
        run: |
          set -e
          cd "$SDK_DIR"
          make package/luci-app-neko/compile V=s -j1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}-${{ matrix.sdk_arch }}
          path: |
            ${{ env.SDK_DIR }}/bin/packages/**/base/luci-app-neko*.apk
            ${{ env.SDK_DIR }}/bin/packages/**/base/luci-app-neko*.ipk
            
