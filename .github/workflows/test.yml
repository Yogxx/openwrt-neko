name: Building Neko DEV 25

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Neko version'
        required: true
        default: '1.3.0-beta'
        type: string
      changelog:
        description: 'Changelog'
        required: true
        default: ''
        type: string

jobs:
  build_packages:
    name: Build Neko Packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        release:
          - 24.10.5
          - 25.12.0-rc4
        arch:
          - x86_64
          - aarch64_generic

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Preparing Theme
        run: |
          git clone -b neko-theme https://github.com/nosignals/neko
          cp -r ./neko/theme/* ./luci-app-neko/htdocs/nekoclash/assets/theme/
          cp -r ./neko/img/* ./luci-app-neko/htdocs/nekoclash/assets/img/

      - name: Preparing Feeds
        run: |
          mkdir -p feeds artifacts
          cp -r ./luci-app-neko ./feeds
          cp -r ./mihomo ./feeds

      - name: Build Packages
        uses: nosignals/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.release }}
          FEED_DIR: ${{ github.workspace }}/feeds
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts

          # paket WAJIB saja (hindari konflik)
          PACKAGES: luci-app-neko

          # debug + stabil
          MAKE_FLAGS: -j1 V=s
          NO_SHFMT_CHECK: 1

          # 🔥 FIX FINAL RECURSIVE DEPENDENCY
          EXTRA_CONFIG: |
            CONFIG_PACKAGE_sing-box=y
            CONFIG_PACKAGE_libcurl=n
            CONFIG_LIBCURL_LDAP=n
            CONFIG_PACKAGE_sing-box-tiny=n

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neko-${{ matrix.release }}_${{ matrix.arch }}
          path: |
            artifacts/bin/packages/**/action/luci-app*
            artifacts/bin/packages/**/action/mihomo*

  release:
    name: Publish Release
    needs: build_packages
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Collect Packages
        run: |
          mkdir -p release
          find . -type f \( -name "*.ipk" -o -name "*.apk" \) -exec cp {} ./release/ \;
          ls -lh release

      - name: Upload Release Assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: neko-dev
          prerelease: true
          overwrite: true
          file_glob: true
          file: release/*
          body: |
            # LUCI APP NEKO (DEV)

            Simple Clash / Mihomo TUN-based Proxy

            ## Information
            - Dev build (not recommended for production)
            - Changelog:
              - ${{ inputs.changelog }}

            ## Compatibility
            - OpenWrt 24.10.x → `.ipk`
            - OpenWrt 25.12.x → `.apk`

            ## Dependencies
            - bash
            - kmod-tun
            - php8
            - php8-cgi
            - curl
            - sing-box
            - mihomo
            
