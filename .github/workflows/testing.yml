name: Build Neko Snapshot (25.xx - APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        arch:
          - armsr-armv8
          - x86-64

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Custom Feed
        run: |
          mkdir -p custom-feeds/neko
          cp -rf ./luci-app-neko custom-feeds/neko/

      - name: Build Package (Snapshot SDK - APK)
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-snapshot
          FEEDNAME: neko
          FEEDDIR: ${{ github.workspace }}/custom-feeds
          PACKAGES: luci-app-neko
          V: s

      - name: Collect APK
        run: |
          mkdir -p release
          find bin/ -type f -name "*.apk" -exec cp {} release/ \;

          echo "Collected files:"
          ls -lah release

          if ! ls release/*.apk 1> /dev/null 2>&1; then
            echo "No APK generated!"
            exit 1
          fi

      - name: Upload Unified Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neko-snapshot
          path: release/*.apk
          if-no-files-found: error
          overwrite: true

  release:
    name: Publish Snapshot Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: neko-snapshot
          path: artifacts

      - name: Show Files
        run: ls -R artifacts

      - name: Create / Update Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/*.apk
          tag: snapshot
          file_glob: true
          overwrite: true
          prerelease: true
          
