name: Build Neko Next (Snapshot / 25.12 - APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build ${{ matrix.arch }} - snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        arch:
          - armsr-armv8
          - x86-64

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Custom Feed
        run: |
          mkdir -p custom-feeds/neko
          cp -rf ./luci-app-neko custom-feeds/neko/

      - name: Build Package (Snapshot SDK - APK)
        uses: openwrt/gh-action-sdk@v7
        env:
          ARCH: ${{ matrix.arch }}-snapshot
          FEEDNAME: neko
          FEEDDIR: ${{ github.workspace }}/custom-feeds
          PACKAGES: luci-app-neko
          V: s

      - name: Collect APK Artifacts
        run: |
          mkdir -p ./release
          find bin/ -type f -name "*.apk" -exec cp {} ./release/ \;

          if [ -z "$(ls -A ./release)" ]; then
            echo "Error: No .apk packages found!"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: neko-snapshot-${{ matrix.arch }}
          path: ./release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./all-builds

      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./all-builds/**/*
          tag: neko-snapshot-${{ github.run_number }}
          file_glob: true
          overwrite: false
          
