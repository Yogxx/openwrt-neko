redir-port: 7891
tproxy-port: 7894
port: 7890
socks-port: 7892
mixed-port: 7893
mode: rule
log-level: silent
allow-lan: true
#routing-mark: 0x100
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 15
keep-alive-idle: 600
disable-keep-alive: false
enable-process: true
find-process-mode: always
external-controller: "0.0.0.0:9090"
secret: one
bind-address: "0.0.0.0"
external-ui: "ui"
external-ui-name: zashboard
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist-cdn-fonts.zip
ipv6: false
tun:
  enable: true
  stack: system
  device: Meta
  dns-hijack:
    - tcp://any:53
    - udp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  disable-icmp-forwarding: false
  endpoint-independent-nat: true
dns:
  enable: true
  cache-algorithm: arc
  ipv6: false
  listen: "0.0.0.0:1053"
  enhanced-mode: redir-host
  respect-rules: true
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
    #- https://dns.google/dns-query
    #- https://dns.cloudflare.com/dns-query
  proxy-server-nameserver:
    - 112.215.198.254
    - 112.215.198.248
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
  use-hosts: true
profile:
  store-selected: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      port:
        - "80"
        - "8080"
      override-destination: true
    TLS:
      port:
        - "443"
        - "8443"
      override-destination: true
    QUIC:
      port:
        - "443"
        - "8443"
      override-destination: true
rule-providers:
  R_ads_all:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs"
    path: "./rule_provider/block_ads_all.mrs"
    interval: 86400
  R_nsfw:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-porn.mrs"
    path: "./rule_provider/block_porn.mrs"
    interval: 86400
  R_whatsapp:
    type: http
    behavior: domain
    format: mrs
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/whatsapp.mrs"
    path: "./rule_provider/whatsapp.mrs"
    interval: 86400
proxy-providers:
  Proxy:
    type: file
    path: "./proxy_provider/akun.yaml"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxy-groups:
  - name: SELECT
    type: select
    disable-udp: false
    use:
      - Proxy
  - name: FALLBACK
    type: fallback
    disable-udp: false
    use:
      - Proxy
    url: https://www.gstatic.com/generate_204
    interval: 120
  - name: URLTEST
    type: url-test
    disable-udp: false
    use:
      - Proxy
    url: https://www.gstatic.com/generate_204
    interval: 120
  - name: WHATSAPP
    type: select
    disable-udp: false
    proxies:
      - FALLBACK
      - SELECT
rules:
  - AND,((NETWORK,udp),(DST-PORT,443)),REJECT-DROP
  - RULE-SET,R_whatsapp,WHATSAPP
  - RULE-SET,R_ads_all,REJECT-DROP
  - RULE-SET,R_nsfw,REJECT-DROP
  - MATCH,GLOBAL
